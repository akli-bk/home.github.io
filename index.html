<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* 新增视频背景样式 */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.5; /* 降低透明度避免干扰内容 */
        }
    </style>
</head>

<body>
    <!-- 在 body 最顶部插入视频背景 -->
    <video class="video-background" autoplay muted loop>
        <source src="https://video.wixstatic.com/video/84770f_b793238cca0f44718eb2e11b0a184320/1080p/mp4/file.mp4" type="video/mp4">
    </video>

    <!-- 保留原有框架的所有内容（导航栏、个人介绍等） -->
    <span class="mobile btn-mobile-menu">
        <i class="social iconfont icon-list btn-mobile-menu__icon"></i>
        <i class="social iconfont icon-angleup btn-mobile-close__icon hidden"></i>
    </span>
    <header id="panel" class="panel-cover">
        <!-- 原有 header 内容（略） -->
    </header>

    <!-- 保留原有脚本 -->
    <script type="text/javascript" src="https://unpkg.com/dmego-home-page@latest/assets/js/main.js"></script>
    <script type="text/javascript" src="./assets/json/images.json?cb=getBingImages"></script>
